normalize: null
unused_parameters: true

encoder: qformer_whisper_v2
encoder_conf:
    whisper_model: medium
    dropout_rate: 0.0
    use_specaug: false
    download_dir: /home/38_data/pcguo/model/whisper
    num_query_tokens: 16
    num_hidden_layers: 2

decoder: qformer_whisper_v2
decoder_conf:
    whisper_model: medium
    dropout_rate: 0.0
    download_dir: /home/38_data/pcguo/model/whisper

preprocessor: tgtspk
preprocessor_conf:
    train_spk2enroll: data/train_100_sglspk/spk2enroll.json
    enroll_name: "enroll"
    enroll_embedding: false  # use speech enrollment
    enroll_segment: 160000  # crop to 10s speech
    whisper_language: "en"
    whisper_task: "transcribe"

model: ts_qformer_v4
model_conf:
    ctc_weight: 0.0
    lsm_weight: 0.1
    length_normalized_loss: false
    extract_feats_in_collect_stats: false
    sym_sos: "<|startoftranscript|>"
    sym_eos: "<|endoftext|>"
    contrastive_type: "w2v2"
    contrastive_weight: 20.0
    contrastive_temp: 0.1
    num_negatives: 20

frontend: null
input_size: 1                   # to prevent build_model() from complaining

seed: 2022
log_interval: 100
num_att_plot: 0
num_workers: 4
sort_in_batch: descending       # how to sort data in making batch
sort_batch: descending          # how to sort created batches
batch_type: numel
batch_bins: 20000000            # good for 1 * 48G A6000 GPU
accum_grad: 2
max_epoch: 10
patience: none
init: none
best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 5

use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false

# LoRA finetune related
use_lora: true
save_lora_only: true
lora_conf:
    rank: 16
    alpha: 32
    dropout_rate: 0.05
    target_modules: ["query", "key", "value", "out"]
    other_trainable_modules: ["qformer", "prompt_proj"]

optim: adamw
grad_clip: 1.0
optim_conf:
    lr: 5.0e-05
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.99
    eps: 1.0e-06
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 1500
